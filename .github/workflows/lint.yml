name: lint
on:
  workflow_call:
    inputs:
      directory:
        type: string
        required: false
        description: Path to the directory to run golangci-lint in.
      golangci_path:
        type: string
        required: false
        description: Path to golangci.yml
      golangci_version:
        type: string
        required: false
        description: Version of golangci-lint to use.
      timeout:
        type: string
        required: false
        description: Timeout for golangci-lint.
      pre-run:
        type: string
        required: false
        description: Command to run before golangci-lint, e.g. to generate code.
      os:
        type: string
        required: false
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'
        description: JSON array of OS runners to use.

permissions:
  # Required: allow read access to the content for analysis.
  contents: read
  # Optional: allow read access to pull request. Use with `only-new-issues` option.
  pull-requests: read
  # Optional: allow write access to checks to allow the action to annotate code in the PR.
  checks: write

jobs:
  lint:
    strategy:
      matrix:
        os: ${{ fromJson(inputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      # By default, the GitHub Action on Windows uses `core.autocrlf=true`.
      # LF is converted to CRLF, this produces reports from formatters (gofmt/gofumpt/etc.).
      - run: "git config --global core.autocrlf input"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ${{ github.repository }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: charmbracelet/meta
          path: charmbracelet/meta
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Use the Go version declared in the repo's go.mod instead of the
          # latest stable release, so golangci-lint (built against an older
          # Go) doesn't panic when a new Go version is released.
          go-version-file: ${{ format('{0}/{1}/go.mod', github.repository, inputs.directory || '') }}
      - name: Pre-run command
        if: ${{ inputs.pre-run != '' }}
        working-directory: ${{ format('{0}/{1}', github.repository, inputs.directory || '') }}
        run: ${{ inputs.pre-run }}
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          working-directory: ${{ format('{0}/{1}', github.repository, inputs.directory || '') }}
          args: |
            --config="${{ inputs.golangci_path || format('{0}/{1}/meta/golangci.yml', github.workspace, github.repository_owner) }}" --timeout=${{ inputs.timeout || '5m' }} ./...
          version: ${{ inputs.golangci_version || 'latest' }}
