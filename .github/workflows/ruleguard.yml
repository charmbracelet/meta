name: ruleguard

on:
  workflow_call:
    inputs:
      go-version:
        required: false
        type: string
        default: stable
      cache:
        required: false
        type: boolean
        default: true
      args:
        required: false
        type: string
        default: ""
      run:
        required: false
        type: string
    secrets:
      gh_pat:
        required: false

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GH_PAT: ${{ secrets.gh_pat }}
      RUN: ${{ inputs.run }}
    steps:
      - run: |
          git config --global url."https://${{ secrets.gh_pat }}@github.com/charmbracelet".insteadOf "https://github.com/charmbracelet"
          git config --global url."https://${{ secrets.gh_pat }}@github.com/charmcli".insteadOf "https://github.com/charmcli"
        if: env.GH_PAT != null
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: dgryski/semgrep-go
          path: rules
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ inputs.go-version }}
          cache: ${{ inputs.cache }}
      - run: ${{ inputs.run }}
        if: env.RUN != null
      - name: ruleguard
        run: |
          # needs to be outside of the workspace for some reason
          mv rules ../
          # Build ruleguard from source with x/tools bumped: the released
          # go-ruleguard@latest pins x/tools v0.30.0, which cannot read the
          # Go 1.27 export data format and fails with "internal error:
          # package X without types was imported". Drop once go-ruleguard
          # ships an x/tools >= v0.49.
          git clone --depth 1 https://github.com/quasilyte/go-ruleguard /tmp/go-ruleguard
          go -C /tmp/go-ruleguard get golang.org/x/tools@latest
          go -C /tmp/go-ruleguard install ./cmd/ruleguard
          go get -u github.com/quasilyte/go-ruleguard/dsl@latest
          ruleguard -c=0 -rules ../rules/ruleguard.rules.go ${{ inputs.args }} ./...
